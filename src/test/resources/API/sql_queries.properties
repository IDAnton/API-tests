SQL_TRUNCATE=TRUNCATE TABLE orders, users RESTART IDENTITY CASCADE

SQL_INSERT_USER=INSERT INTO users (name, email, status, created_at) VALUES (?, ?, ?, ?::TIMESTAMPTZ)

SQL_SELECT_BY_EMAIL=SELECT * FROM users WHERE email LIKE ?

SQL_INSERT_ORDERS=INSERT INTO orders (user_id, amount, status, created_at) VALUES (?::BIGINT, ?::NUMERIC, ?, ?::TIMESTAMPTZ)

SQL_JOIN_LARGE_ORDERS=SELECT DISTINCT u.name FROM users u INNER JOIN orders o ON u.id = o.user_id WHERE o.amount > ?

SQL_SELECT_NEW_ACTIVE_USERS=SELECT * FROM public.users WHERE status = 'active' AND created_at >= NOW() - (? * INTERVAL '1 day')

SQL_INSERT_NEW_USER_WITH_ORDER=WITH new_user as \
  (INSERT INTO users (name, email, status, created_at) VALUES (?, ?, ?, ?) RETURNING id) \
  INSERT INTO orders (user_id, amount, status, created_at) SELECT id, ?, ?, ? FROM new_user