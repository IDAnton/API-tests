services:
  postgres:
    image: postgres:15-alpine
    container_name: test_postgres
    env_file:
      - src/test/resources/API/database.properties
    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./src/test/resources/API/init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql

  redpanda:
    image: redpandadata/redpanda:v23.3.5
    container_name: test_redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 256M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: [ "CMD", "rpk", "cluster", "health" ]
      interval: 3s
      timeout: 3s
      retries: 5

  akhq:
    image: tchiotludo/akhq:0.25.0
    container_name: test_akhq
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka-cluster:
              properties:
                bootstrap.servers: "redpanda:9092"
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  pg_data:
